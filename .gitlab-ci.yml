# ================================
# GITLAB CI/CD PIPELINE
# ================================
# Pipeline généré par zairakai/laravel-dev-tools.
# Hérite du template complet — seules les variables propres à ce projet
# sont définies ici.
#
# Pour mettre à jour le template après composer update :
#   composer update zairakai/laravel-dev-tools
#   (La ref: ci-dessous est mise à jour automatiquement)

include:
  - project: 'zairakai/php-packages/laravel-dev-tools'
    ref: 3.0.1
    file: '.gitlab/ci/pipeline-php-package.yml'

variables:
  # Identifiant unique du cache Composer pour ce projet
  CACHE_KEY: "laravel-eloquent"

  # Nom complet du package sur Packagist
  # Utilisé dans la release GitLab pour le lien vers Packagist
  PACKAGIST_PACKAGE: "zairakai/laravel-eloquent"

# The documentation site, published with GitLab Pages from main: main ("next") and every released version,
# each built from its own tag, with a version selector. See docs/scripts/publish.sh.
pages:
  stage: publish
  image: zairakai/node:latest-dev
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script:
    - node --version
  script:
    - bash docs/scripts/publish.sh
  # The next jobs of the runner must not find (and lint) the docs dependencies.
  after_script:
    - rm -rf docs/node_modules docs/reference docs/guide docs/.vitepress/dist docs/.vitepress/cache
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
